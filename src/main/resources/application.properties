spring.application.name=zosh-pos-system

server.port=${PORT:5000}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
# Set explicitly so Hibernate doesn't need a live DB connection at startup just to
# figure out which dialect to use. Without this, app startup crashes if the DB
# is briefly unreachable, even though the app would otherwise recover fine.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Without this, Hibernate still opens one connection at startup purely to read
# extra JDBC metadata (identifier casing, type mappings, etc.), separate from
# schema generation. Setting this to false stops that, so startup never needs
# a live DB connection at all - the app boots and connects lazily on first real query.
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:pos_bhumi}
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Cloudinary
cloudinary.cloud-name=chb75b02
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.upload-folder=${CLOUDINARY_UPLOAD_FOLDER:zosh-pos/products}

# Upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Razorpay
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:}
